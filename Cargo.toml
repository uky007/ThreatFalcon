[package]
name = "threatfalcon"
version = "0.3.0"
edition = "2021"
description = "Endpoint telemetry sensor for Windows, macOS and Linux threat research"
license = "MIT"
repository = "https://github.com/uky007/ThreatFalcon"
readme = "README.md"
keywords = ["security", "edr", "telemetry", "etw", "windows"]
categories = ["os::windows-apis"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.38"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
async-trait = "0.1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Keep Linux packaging independent of a distro-specific OpenSSL ABI, using
# the administrator's native CA store. Windows/macOS TLS remains unchanged.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "http2", "charset", "system-proxy", "rustls-tls-native-roots"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }

[dev-dependencies]
mockito = "1"
assert_cmd = "2"
predicates = "3"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
